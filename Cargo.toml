[package]
name = "gamesync"
version = "0.1.0"
edition = "2021"
description = "Imports installed Xbox/GamePass games into Steam as non-Steam game shortcuts, with Customization artwork auto-picked from local game files"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "bmp",
  "gif",
  "webp",
  "tiff",
  "ico",
] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow"] }
egui = "0.32"
rfd = "0.15"

[dev-dependencies]
mockall = "0.15"

[[bin]]
name = "GameSync"
path = "src/bin/gamesync-gui.rs"
