    title: "gui_driver + GameSync.exe (eframe/egui windowed app, poe-wayfinder-style) — sole shipped binary"
    status: IMPLEMENTED
    notes: "Setup/Reviewing/Done screens over the same DefaultImportController the CLI driver used. Cross-compiles clean for x86_64-pc-windows-gnu as GameSync.exe (Cargo.toml [[bin]] name = \"GameSync\"), confirmed as a real GUI-subsystem PE32+ binary (file(1) reports 'MS Windows 5.02 (GUI)', not console), clippy-clean on the windows target via lint-windows. The old CLI bin (gamesync.exe) was deleted along with its forge stages so GameSync.exe is the only thing built. NOT yet clicked through on an actual Windows desktop - needs the user, and Windows Smart App Control may block the unsigned exe (see FOLLOWUP.md, no code fix exists - researched against poe-wayfinder, which hits the identical problem and has no solution beyond retrying)."
