    status: VERIFIED
    notes: "e2e run (Linux binary, real XboxGames data, scratch copy of the real shortcuts.vdf) exercised the full flow: scan, accept-defaults prompts, dry-run, real write, backup creation, grid file placement, state update, before the CLI binary was removed per the user's ONLY-ship-the-GUI request. driver::cli_driver itself stays in the tree, unit tested, just not built into an exe anymore."
